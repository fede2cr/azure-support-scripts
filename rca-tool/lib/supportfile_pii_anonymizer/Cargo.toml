[package]
name = "supportfile_pii_anonymizer"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Offline, deterministic PII/environment anonymizer for Azure & Linux (sos/supportconfig) diagnostics. Presidio-inspired recognizer/operator model, pure Rust, WASM-friendly, with subnet-preserving IP anonymization."
readme = "README.md"
repository = "https://github.com/Azure/azure-support-scripts"
keywords = ["pii", "anonymization", "redaction", "azure", "diagnostics"]
categories = ["text-processing"]

[lib]
crate-type = ["rlib"]

[features]
# `serde_json` enables `Anonymizer::scrub_json` for structured/semi-structured
# data. `azure` enables the Azure-specific recognizers (resource IDs, etc.).
# Both are on by default because rca-tool needs them; downstream consumers can
# opt out with `default-features = false`.
default = ["serde_json", "azure"]
serde_json = ["dep:serde_json"]
azure = []

[dependencies]
regex = "1"
serde_json = { version = "1", optional = true }
